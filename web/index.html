<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Habit Flow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Habit Flow</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Sign-In for Web (GIS / google_sign_in_web)
    Replace YOUR_GOOGLE_CLIENT_ID below with your actual OAuth 2.0 Client ID from
    https://console.cloud.google.com → APIs & Services → Credentials
    Authorized origins must include: http://localhost:8080

    Until a real Client ID is set, the app gracefully falls back to the
    manual Gmail entry picker on web.
  -->
  <meta name="google-signin-client_id" content="942937562811-2tsq8qhgp10m8u187b3ria37mlef1b38.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
